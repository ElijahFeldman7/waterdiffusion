model_configuration:
  model_name: GSAI-ML/LLaDA-8B-Instruct
  tokenizer_name: GSAI-ML/LLaDA-8B-Instruct

watermark_type: Ours
watermark_config:
  delta: 0.5
  enforce_kl: false
  convolution_kernel: [-1]
  topk: 50
  n_iter: 1
  seeding_scheme: "sumhash"
  greenlist_type: "bernoulli"
  greenlist_params:
    gamma: 0.25
