model:
  name: "LLaDA-1.5"
  model_path: "GSAI-ML/LLaDA-1.5"
  model_type: "llada"
  trust_remote_code: true
  dtype: "bfloat16"
  device: "cuda"
  device_map: "auto"
  num_parameters: "8B"
  architecture: "diffusion"
  base_model: "LLaDA-8B-Instruct"
  training_method: "VRPO"
  use_chat_template: true
  enhanced_tasks:
    - "math"
    - "code"
    - "alignment"
  
generation:
  max_length: 2048
  num_diffusion_steps: 10
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  do_sample: true
  repetition_penalty: 1.0
  
tokenizer:
  tokenizer_path: "GSAI-ML/LLaDA-1.5"
  trust_remote_code: true
  use_chat_template: true

benchmarks:
  paper: "arXiv:2505.19223"
  comparison_baseline: "LLaDA-8B-Instruct"
  improvement_areas:
    - "Mathematical reasoning"
    - "Code generation"
    - "Instruction alignment"
